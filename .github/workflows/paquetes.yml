name: "Fase 1.8: Fabricador Expreso de Paquetes .DEB"

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build_deb:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📂 Clonar repositorio del Toolbox
        uses: actions/checkout@v4

      # 🛠️ INSTALACIÓN DE HERRAMIENTAS: Provee el compilador aarch64 que exige el Makefile
      - name: 2. 🔌 Configurar Entorno y Compilador Cruzado AArch64
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev

      - name: 3. 🪄 Descargar Fuentes y Headers (883 MB) desde el Historial
        run: |
          mkdir -p linux-stable
          gh run download --name "kernel-tv3s-fuentes-y-headers" --dir linux-stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Construir Paquetes Estructurados .DEB con INFRAESTRUCTURA COMPLETA
        run: |
          VERSION="6.18.44-current-meson64"
          DIR_DEB="$GITHUB_WORKSPACE/deb_build"
          mkdir -p "$DIR_DEB/linux-headers/DEBIAN"
          
          DESTINO="$DIR_DEB/linux-headers/usr/src/linux-headers-$VERSION"
          mkdir -p "$DESTINO"

          echo "=== 🔬 PREPARANDO ENTORNO DE COMPILACIÓN ==="
          cd linux-stable
          
          # 1. Regeneramos el plano base rápido e instalamos el compilador interno
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-current-meson64"/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # 2. Obligamos al kernel a verificar y re-compilar los scripts internos para ARM64
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) scripts modules_prepare

          echo "=== 📦 COPIADO MASIVO DE ARQUITECTURA COMPLEJA ==="
          # Copiamos absolutamente TODO lo que exige el TV stick para compilar nativo
          cp -r include "$DESTINO/"
          cp -r scripts "$DESTINO/"
          cp -r certs "$DESTINO/" 2>/dev/null || true
          
          # Inyectamos de forma obligatoria la estructura de arquitectura ARM64 que faltaba
          mkdir -p "$DESTINO/arch/arm64"
          cp -r arch/arm64/include "$DESTINO/arch/arm64/" 2>/dev/null || true
          cp arch/arm64/Makefile "$DESTINO/arch/arm64/" 2>/dev/null || true
          
          # Archivos de control raíz
          cp .config "$DESTINO/.config"
          cp Module.symvers "$DESTINO/Module.symvers" 2>/dev/null || true
          cp Makefile "$DESTINO/Makefile"
          cd ..

          echo "=== 📦 ESTRUCTURANDO METADATOS DEBIAN ==="
          cat << CONTROL_EOF > "$DIR_DEB/linux-headers/DEBIAN/control"
          Package: linux-headers-$VERSION
          Version: $VERSION-1
          Section: devel
          Priority: optional
          Architecture: arm64
          Maintainer: Daniel <daniel@tvstick-project>
          Description: Cabeceras completas verificadas de Daniel. Incluye scripts, fixdep, arch/arm64 e include estructural.
          CONTROL_EOF

          mkdir -p "$DIR_DEB/linux-headers/lib/modules/$VERSION"
          ln -sf /usr/src/linux-headers-$VERSION "$DIR_DEB/linux-headers/lib/modules/$VERSION/build"

          echo "=== 🛠️ EMPAQUETANDO CON DPKG-DEB ==="
          dpkg-deb --build "$DIR_DEB/linux-headers" "$GITHUB_WORKSPACE/linux-headers-${VERSION}_arm64.deb"

      - name: 5. Subir Instalador .DEB como Artefacto Público
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-deb-tvstick
          path: "*.deb"
          retention-days: 5
