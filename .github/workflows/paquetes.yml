name: "Fase 1.8: Fabricador Expreso de Paquetes .DEB"

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build_deb:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📂 Clonar repositorio del Toolbox
        uses: actions/checkout@v4

      # Forzamos la descarga exacta dentro de la carpeta local linux-stable para imitar el entorno del driver
      - name: 2. 🪄 Descargar Fuentes y Headers (883 MB) desde el Historial
        run: |
          mkdir -p linux-stable
          gh run download --name "kernel-tv3s-fuentes-y-headers" --dir linux-stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Construir Paquetes Estructurados .DEB
        run: |
          VERSION="6.18.44-current-meson64"
          DIR_DEB="$GITHUB_WORKSPACE/deb_build"
          mkdir -p "$DIR_DEB/linux-headers/DEBIAN"
          mkdir -p "$DIR_DEB/linux-headers/usr/src/linux-headers-$VERSION"

          # TRUCO MAESTRO: Como el .config es un archivo oculto que se quedó fuera del zip,
          # obligamos al sistema a regenerar el plano base ARM64 oficial en 1 segundo.
          echo "=== 🛠️ REGENERANDO PLANO DE CONFIGURACIÓN ASIGNADO ==="
          cd linux-stable
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-current-meson64"/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          cd ..

          echo "=== 📦 ESTRUCTURANDO PAQUETE DE HEADERS ==="
          cat << CONTROL_EOF > "$DIR_DEB/linux-headers/DEBIAN/control"
          Package: linux-headers-$VERSION
          Version: $VERSION-1
          Section: devel
          Priority: optional
          Architecture: arm64
          Maintainer: Daniel <daniel@tvstick-project>
          Description: Cabeceras nativas y mapas de simbolos Module.symvers corregidos sin archivos ocultos ausentes.
          CONTROL_EOF

          # Copiamos la estructura apuntando a los archivos verificados de tu listado
          cp -r linux-stable/include "$DIR_DEB/linux-headers/usr/src/linux-headers-$VERSION/"
          cp -r linux-stable/arch/arm64/include "$DIR_DEB/linux-headers/usr/src/linux-headers-$VERSION/arch/arm64/" 2>/dev/null || true
          cp -r linux-stable/scripts "$DIR_DEB/linux-headers/usr/src/linux-headers-$VERSION/"
          cp linux-stable/.config "$DIR_DEB/linux-headers/usr/src/linux-headers-$VERSION/.config"
          cp linux-stable/Module.symvers "$DIR_DEB/linux-headers/usr/src/linux-headers-$VERSION/Module.symvers" 2>/dev/null || true
          cp linux-stable/Makefile "$DIR_DEB/linux-headers/usr/src/linux-headers-$VERSION/Makefile"

          mkdir -p "$DIR_DEB/linux-headers/lib/modules/$VERSION"
          ln -sf /usr/src/linux-headers-$VERSION "$DIR_DEB/linux-headers/lib/modules/$VERSION/build"

          echo "=== 🛠️ EMPAQUETANDO CON DPKG-DEB ==="
          dpkg-deb --build "$DIR_DEB/linux-headers" "$GITHUB_WORKSPACE/linux-headers-${VERSION}_arm64.deb"

      - name: 4. Subir Instalador .DEB como Artefacto Público
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-deb-tvstick
          path: "*.deb"
          retention-days: 5
