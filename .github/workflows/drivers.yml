name: "Fase 1.5: Compilador de Drivers RTL8189ES (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-realtek-driver:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar tu repositorio toolbox
      uses: actions/checkout@v4

    - name: 2. Instalar herramientas de compilación cruzada
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex kmod

    - name: 3. 🔍 Localizar última ejecución exitosa del Kernel
      id: locate-kernel
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Cambiamos la expresión jq a la sintaxis estándar de arreglos para evitar errores de parseo
        RUN_ID=$(gh run list --workflow "Fase 1: Compilador de Kernel 6.18.44 Puro (S905X)" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        echo "El ID del kernel encontrado es: $RUN_ID"
        echo "kernel_run_id=$RUN_ID" >> $GITHUB_OUTPUT

    - name: 4. 🪄 Jalar fuentes del Kernel desde el historial público
      uses: actions/download-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable
        run-id: ${{ steps.locate-kernel.outputs.kernel_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: 5. Clonar el repositorio oficial del Driver RTL8189ES
      run: |
        git clone --depth 1 https://github.com/jwrdegoede/rtl8189ES_linux rtl8189es

    - name: 6. 🔍 SUPER-DIAGNÓSTICO Y COMPILACIÓN FORZADA
      working-directory: ./rtl8189es
      run: |
        echo "=== 1. Restaurando permisos ejecutable a todo el árbol de herramientas ==="
        chmod -R +x ../linux-stable/scripts/
        
        echo "=== 2. Inyectando soporte de Red Inalámbrica en el Kernel ==="
        echo "CONFIG_WLAN=y" >> ../linux-stable/.config
        echo "CONFIG_CFG80211=m" >> ../linux-stable/.config
        echo "CONFIG_RTL8188E=m" >> ../linux-stable/.config
        make -C ../linux-stable ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        echo "=== 3. DIAGNÓSTICO AVANZADO DEL MAKEFILE REALTEK ==="
        # 1. Buscamos dentro del Makefile cómo se llaman exactamente las variables de arquitectura para este chip
        grep -i -E "ARCH|CROSS|KSRC|KERNEL_SRC|obj-" Makefile | head -n 30
        
        # 2. Simulamos la ejecución del comando mostrando qué comandos intentaría correr internamente
        make -n ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          KSRC=$GITHUB_WORKSPACE/linux-stable \
          KERNEL_SRC=$GITHUB_WORKSPACE/linux-stable \
          -C ../linux-stable \
          M=$GITHUB_WORKSPACE/rtl8189es \
          modules
        
        echo "=== 4. Intento de Compilación con Multi-Variables de Entorno ==="
        # Pasamos absolutamente todas las variables clásicas que usan los Makefiles de Realtek para ARM64
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          KSRC=$GITHUB_WORKSPACE/linux-stable \
          KERNEL_SRC=$GITHUB_WORKSPACE/linux-stable \
          -C ../linux-stable \
          M=$GITHUB_WORKSPACE/rtl8189es \
          CONFIG_RTL8188E=m \
          modules
        
        echo "=== 5. Rastrear archivos .ko generados ==="
        find . -name "*.ko"


    - name: 7. Guardar el archivo .ko listo para el TV Stick
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: driver-wifi-rtl8189es
        path: rtl8189es/**/*.ko # 👈 Los asteriscos buscan en todas las subcarpetas de forma recursiva
