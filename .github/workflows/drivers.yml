name: "Fase 1.5: Compilador de Drivers Realtek (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-driver:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar el compilador cruzado ARM64 oficial
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex kmod

    - name: 3. 🪄 Jalar fuentes compiladas del Kernel anterior
      uses: actions/download-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable # Lo descarga y lo extrae automáticamente en esta carpeta
        github-token: ${{ secrets.GITHUB_TOKEN }} # Permiso interno automático

    - name: 4. Compilar el Driver de Realtek
      working-directory: ./drivers/realtek
      run: |
        # Le ordenamos al compilador de ARM64 que use el código fuente que acabamos de jalar
        # Cambia 'tu_driver.ko' por el comando real cuando metamos los archivos .c
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C ../../linux-stable M=$(pwd) modules

    - name: 5. Guardar el módulo final (.ko) para el TV Stick
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: driver-realtek-s905x
        path: drivers/realtek/*.ko
