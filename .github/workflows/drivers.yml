name: "Fase 1.5: Compilador de Drivers RTL8189ES (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-realtek-driver:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar tu repositorio toolbox
      uses: actions/checkout@v4

    - name: 2. Instalar herramientas de compilación cruzada
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex kmod

    - name: 3. 🔍 Localizar última ejecución exitosa del Kernel
      id: locate-kernel
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Usamos la sintaxis explícita de arreglos .[0].databaseId para blindar el parseo de jq contra fallos
        RUN_ID=$(gh run list --workflow "Fase 1: Compilador de Kernel 6.18.44 Puro (S905X)" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        echo "kernel_run_id=$RUN_ID" >> $GITHUB_OUTPUT

    - name: 4. 🪄 Jalar fuentes del Kernel desde el historial público
      uses: actions/download-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable
        run-id: ${{ steps.locate-kernel.outputs.kernel_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: 5. Clonar el repositorio oficial del Driver RTL8189ES
      run: |
        git clone --depth 1 https://github.com/jwrdegoede/rtl8189ES_linux rtl8189es

    - name: 6. Restaurar permisos, AUDITAR SÍMBOLOS y Compilar el Módulo Wi-Fi
      working-directory: ./rtl8189es
      run: |
        # 1. Devolvemos permisos a toda la carpeta de scripts
        chmod -R +x ../linux-stable/scripts/
        
        # 2. 🔍 AUDITORÍA CIENTÍFICA DEL PARSE ERROR
        echo "=========================================================="
        echo "🔬 EXAMINANDO EL CONTENIDO REAL DE Module.symvers:"
        echo "=========================================================="
        if [ -f ../linux-stable/Module.symvers ]; then
          # cat -A muestra caracteres ocultos: los TAB se verán como ^I y los saltos de línea como $
          echo "-> Estructura de caracteres ocultos (Primeras 15 líneas):"
          head -n 15 ../linux-stable/Module.symvers | cat -A
          
          echo "----------------------------------------------------------"
          # Contamos si hay espacios comunes en lugar de tabuladores reales
          ESPACIOS=$(grep -c " " ../linux-stable/Module.symvers || true)
          echo "-> Líneas con espacios comunes detectadas: $ESPACIOS"
          
          echo "----------------------------------------------------------"
          # Validamos si cumple la regla estricta de modpost (4 campos por línea)
          echo "-> Validación de campos por línea (Debe haber exactamente 4 por fila):"
          awk -F'\t' '{print "Fila "NR": tiene "NF" campos. Contenido: "$0}' ../linux-stable/Module.symvers | head -n 15
        else
          echo "❌ ERROR CRÍTICO: El archivo Module.symvers no existe en linux-stable."
        fi
        echo "=========================================================="
        
        # 3. Inyectamos el soporte inalámbrico directo en el plano del kernel
        echo "CONFIG_WLAN=y" >> ../linux-stable/.config
        echo "CONFIG_CFG80211=m" >> ../linux-stable/.config
        make -C ../linux-stable ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # 4. Lanzamos la compilación cruzada inyectando la LOCALVERSION exacta
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION=-current-meson64 \
          -C ../linux-stable \
          M=$GITHUB_WORKSPACE/rtl8189es \
          obj-m=8189es.o \
          modules


    - name: 7. Guardar el archivo .ko listo para el TV Stick
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: driver-wifi-rtl8189es
        path: rtl8189es/**/*.ko
