name: "Fase 1.5: Compilador de Drivers RTL8189ES (S905X)"

on:
  workflow_dispatch: # Control manual por botón desde la web

jobs:
  build-realtek-driver:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar tu repositorio toolbox
      uses: actions/checkout@v4

    - name: 2. Instalar herramientas de compilación cruzada
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex kmod

    - name: 3. 🪄 Jalar fuentes compiladas del Kernel anterior
      uses: actions/download-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: 4. Clonar el repositorio oficial del Driver RTL8189ES
      run: |
        # Clonamos el repositorio exacto que encontraste directamente en la nube
        git clone --depth 1 https://github.com/jwrdegoede/rtl8189ES_linux rtl8189es

    - name: 5. Compilar el Módulo Wi-Fi para ARM64
      working-directory: ./rtl8189es
      run: |
        # Usamos el Makefile oficial del driver apuntando a las cabeceras de tu kernel 6.18.44
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C ../linux-stable M=$(pwd) modules

    - name: 6. Guardar el archivo .ko listo para el TV Stick
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: driver-wifi-rtl8189es
        path: rtl8189es/*.ko
