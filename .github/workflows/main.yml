name: "Fase 1: Compilador de Kernel 6.18.44 Puro (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-pure-kernel:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar el compilador cruzado ARM64 oficial
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev libelf-dev kmod

    - name: 3. Clonar y cambiar exactamente a la etiqueta v6.18.44
      run: |
        # Clonamos indicando un límite de profundidad para ahorrar tiempo en la nube
        git clone --depth 50 https://kernel.org linux-stable
        
        cd linux-stable
        # Nos paramos de forma estricta en el tag que acabamos de validar en la terminal
        git checkout tags/v6.18.44 -b rama-6.18.44

    - name: 4. Generar configuración y Preparar Cabeceras (RÁPIDO)
      working-directory: ./linux-stable
      run: |
        # 1. Generamos la configuración base arm64 idéntica a tu TV stick
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
        
        # 2. TRUCO CLAVE: Prepara scripts, estructuras y cabeceras de enlace en segundos sin compilar el kernel vmlinux
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

    - name: 5. Guardar las fuentes estructuradas para los Drivers
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable/

    - name: 6. Guardar las fuentes completas con sus cabeceras para los Drivers
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable/
