name: "Fase 1: Compilador de Kernel 6.18.44 Puro (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-pure-kernel:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar el compilador cruzado ARM64 oficial
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev libelf-dev kmod

    - name: 3. Clonar el repositorio oficial de Git Kernel
      run: |
        # Clonamos usando la URL larga exacta para evitar redirecciones raras
        git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux-stable
        
        # Entramos y forzamos el cambio a la rama estable 6.18
        cd linux-stable
        git checkout linux-6.18.y

    - name: 4. Generar configuración y Compilar Kernel
      working-directory: ./linux-stable
      run: |
        # 1. Generamos la configuración por defecto para procesadores ARM64
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
        
        # 2. Compilamos el kernel a máxima potencia en la nube
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules dtbs

    - name: 5. Guardar el motor del Kernel compilado (Image)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-binario-puro
        path: |
          linux-stable/arch/arm64/boot/Image
          linux-stable/arch/arm64/boot/dts/amlogic/*.dtb

    - name: 6. Guardar las fuentes completas con sus cabeceras para los Drivers
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable/
