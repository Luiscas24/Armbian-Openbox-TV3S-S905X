name: "Fase 1: Compilador de Kernel 6.18.48 Puro (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-pure-kernel:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar el compilador cruzado ARM64 oficial y herramientas de empaquetado
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev libelf-dev kmod rsync dpkg-dev binfmt-support debhelper libdw-dev

    - name: 3. Clonar exclusivamente la etiqueta v6.18.48 (Velocidad Máxima)
      run: |
        # Clonamos un solo commit apuntando directamente a la etiqueta v6.18.48 desde el Git oficial
        git clone --depth 1 --branch v6.18.48 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/ linux-stable

    - name: 4. Generar configuración, Activar Módulos y Compilar Kernel Completo
      working-directory: ./linux-stable
      run: |
        # Configuración base del kernel y compatibilidad de módulos
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
        sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-current-meson64"/' .config
        sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' .config
        grep -q "CONFIG_MODULES=y" .config || echo "CONFIG_MODULES=y" >> .config
        echo "CONFIG_MODULE_UNLOAD=y" >> .config
        echo "CONFIG_MODVERSIONS=y" >> .config
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # Creamos las carpetas de estructura de empaquetado de Debian
        mkdir -p scripts/package/debian
        
        # =========================================================================
        # 🛡️ LA JUGADA MAESTRA: CAMBIAR EL DESTINO DE DEBIAN A UNA CARPETA EN EXT4
        # =========================================================================
        # Obligamos a Debian a instalar los binarios nativos del Makefile dentro de 
        # /usr/share/kernel-s905x/ en lugar de /boot/ para evitar que dpkg intente 
        # hacer hard links imposibles en la partición FAT32 durante el desempaquetado.
        cat << 'EOF' > scripts/package/debian/rules
        #!/usr/bin/make -f
        %:
        	dh $@

        override_dh_install:
        	dh_install
        	mkdir -p debian/linux-image-6.18.48-current-meson64/usr/share/kernel-s905x
        	mv debian/linux-image-6.18.48-current-meson64/boot/* debian/linux-image-6.18.48-current-meson64/usr/share/kernel-s905x/
        EOF
        chmod +x scripts/package/debian/rules

        # =========================================================================
        # 🔧 AUTOMATIZACIÓN DE ARRANQUE PARA TV STICK (POSTINST)
        # =========================================================================
        # El script ahora vive en Ext4, se ejecuta al 100% y despliega los archivos
        # hacia la partición FAT32 de forma controlada y transparente.
        cat << 'EOF' > scripts/package/debian/postinst
        #!/bin/sh
        set -e
        if [ "$1" = "configure" ]; then
            echo "===================================================="
            echo "🔧 DESPLIEGUE SEGURO DEL KERNEL EN FAT32 (POSTINST) 🔧"
            echo "===================================================="
            
            # Limpiamos los archivos viejos en FAT32 sin restricciones de dpkg
            rm -f /boot/System.map-6.18.48-current-meson64
            rm -f /boot/config-6.18.48-current-meson64
            rm -f /boot/vmlinuz-6.18.48-current-meson64
            
            # Movemos los binarios nuevos desde la zona segura Ext4 hacia FAT32
            cp /usr/share/kernel-s905x/System.map-6.18.48-current-meson64 /boot/
            cp /usr/share/kernel-s905x/config-6.18.48-current-meson64 /boot/
            cp /usr/share/kernel-s905x/vmlinuz-6.18.48-current-meson64 /boot/
            
            # Ejecutamos tu extractor automático de la Image pura para el U-Boot
            cd /boot
            [ -f Image ] && mv Image Image.bak || true
            tail -c +25 vmlinuz-6.18.48-current-meson64 | gunzip > Image
            chmod +x Image
            echo "✅ ¡Ecosistema actualizado y configurado con éxito para el U-Boot!"
        fi
        EOF
        chmod +x scripts/package/debian/postinst

        # Compilación del Kernel y generación nativa del combo de paquetes .deb
        # Neutralizamos /sbin/installkernel pasando la bandera INSTALLKERNEL=/bin/true
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules dtbs
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) bindeb-pkg DPKG_FLAGS="-d" INSTALLKERNEL=/bin/true

    - name: 5. Guardar el motor del Kernel compilado tradicional (Image y DTBs)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-binario-puro
        path: |
          linux-stable/arch/arm64/boot/Image
          linux-stable/arch/arm64/boot/dts/amlogic/*.dtb

    - name: 6. Guardar las fuentes completas con sus cabeceras para los Drivers (Acceso Total)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable/

    - name: 7. Guardar los instaladores empaquetados en paquetes .DEB oficiales
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: paquetes-deb-kernel-6.18.48
        path: ./*.deb
