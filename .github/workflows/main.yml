name: "Fase 1: Compilador de Kernel 6.18.44 Puro (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-pure-kernel:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar el compilador cruzado ARM64 oficial
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev libelf-dev kmod

    - name: 3. Clonar exclusivamente la etiqueta v6.18.44 (Velocidad Máxima)
      run: |
        # Clonamos un solo commit apuntando directamente a la etiqueta v6.18.44 usando la dirección exacta requerida
        git clone --depth 1 --branch v6.18.44 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/ linux-stable

    - name: 4. Generar configuración y Preparar Cabeceras (RÁPIDO)
      working-directory: ./linux-stable
      run: |
        # 1. Generamos la configuración base arm64
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
        
        # 2. Generamos exclusivamente los archivos .h y estructuras de enlace modular en segundos
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

    - name: 5. Guardar las fuentes estructuradas para los Drivers
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable/
