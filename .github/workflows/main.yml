name: "Fase 1: Compilador de Kernel 6.18.44 (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-specific-kernel:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Clonar el framework oficial de Armbian
      run: |
        git clone --depth 1 https://github.com/armbian/build armbian-build

    - name: 3. Ejecutar la compilación nativa forzada a 6.18.44
      working-directory: ./armbian-build
      env:
        FORCE_BASH_DATA: "yes"
      run: |
        # Inyectamos la URL larga del árbol estable y su rama correspondiente de forma estricta
        ./compile.sh \
          BOARD=lepotato \
          BRANCH=edge \
          RELEASE=bookworm \
          BUILD_MINIMAL=yes \
          KERNEL_CONFIGURE=no \
          INSTALL_HEADERS=yes \
          DOCKER=no \
          KERNEL_GIT_TAG="v6.18.44" \
          KERNELBRANCH="linux-6.18.y" \
          KERNELSOURCE="https://kernel.org" \
          kernel

    - name: 4. Guardar paquetes .deb instalables
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-debs
        path: armbian-build/output/debs/*.deb

    - name: 5. Guardar copia de seguridad de las fuentes compiladas
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-fuentes-compiladas
        path: |
          armbian-build/cache/sources/linux-mainline/linux-6.18.44/
          armbian-build/cache/sources/linux-mainline/

    - name: 6. 🚨 CAPTURAR LOG EN CASO DE FALLO
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-de-error-armbian
        path: |
          armbian-build/output/logs/*.log
          armbian-build/.tmp/logs-*/**/*.log
