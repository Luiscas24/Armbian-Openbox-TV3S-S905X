name: "Fase 1: Compilador de Kernel 6.18.48 Puro (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-pure-kernel:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar el compilador cruzado ARM64 oficial y herramientas de empaquetado
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev libelf-dev kmod rsync dpkg-dev binfmt-support debhelper libdw-dev

    - name: 3. Clonar exclusivamente la etiqueta v6.18.48 (Velocidad Máxima)
      run: |
        # Clonamos un solo commit apuntando directamente a la etiqueta v6.18.48 desde el Git oficial
        git clone --depth 1 --branch v6.18.48 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/ linux-stable

    - name: 4. Generar configuración, Activar Módulos y Compilar Kernel Completo
      working-directory: ./linux-stable
      run: |
        # 1. Generamos la configuración base arm64
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
        
        # 2. INYECTAMOS EL SUFIJO REAL DE TU TV STICK
        sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-current-meson64"/' .config
        
        # 3. CORRECCIÓN CRUCIAL: Forzamos la activación de módulos externos y descarga en caliente
        sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' .config
        grep -q "CONFIG_MODULES=y" .config || echo "CONFIG_MODULES=y" >> .config
        echo "CONFIG_MODULE_UNLOAD=y" >> .config
        echo "CONFIG_MODVERSIONS=y" >> .config
        
        # Sincronizamos los cambios para asegurar que el plano de configuración sea consistente
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        
        # 4. COMPILACIÓN ESTRUCTURADA TRADICIONAL Y GENERACIÓN DE .DEB SIMULTÁNEA
        # Compilamos primero el árbol clásico para asegurar Image, dtbs y fuentes completas
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules dtbs
        
        # Inmediatamente después empaquetamos en .deb oficiales para tener los instaladores listos
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) bindeb-pkg

    - name: 5. Guardar el motor del Kernel compilado tradicional (Image y DTBs)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-binario-puro
        path: |
          linux-stable/arch/arm64/boot/Image
          linux-stable/arch/arm64/boot/dts/amlogic/*.dtb

    - name: 6. Guardar las fuentes completas con sus cabeceras para los Drivers (Acceso Total)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-fuentes-y-headers
        path: linux-stable/

    - name: 7. Guardar los instaladores empaquetados en paquetes .DEB oficiales
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: paquetes-deb-kernel-6.18.48
        path: ./*.deb
