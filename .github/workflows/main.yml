name: "Fase 1: Compilador de Kernel 6.18.44 (S905X)"

on:
  workflow_dispatch: # Control manual por botón desde la web

jobs:
  build-specific-kernel:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Clonar el framework oficial de Armbian
      run: |
        git clone --depth 1 https://github.com/armbian/build armbian-build

    - name: 3. Ejecutar la compilación en limpio
      working-directory: ./armbian-build
      env:
        FORCE_BASH_DATA: "yes"
      run: |
        ./compile.sh \
          BOARD=lepotato \
          BRANCH=edge \
          RELEASE=bookworm \
          BUILD_MINIMAL=yes \
          KERNEL_CONFIGURE=no \
          INSTALL_HEADERS=yes \
          KERNEL_GIT_TAG="v6.18.44" \
          kernel

    - name: 4. Guardar paquetes .deb instalables
      if: always() # Se ejecuta incluso si algo posterior falla
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-debs
        path: armbian-build/output/debs/*.deb

    - name: 5. Guardar copia de seguridad de las fuentes compiladas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tv3s-fuentes-compiladas
        path: |
          armbian-build/cache/sources/linux-mainline/orange-pi-6.18.44/
          armbian-build/cache/sources/linux-mainline/linux-6.18.44/
        # Nota: Ponemos ambas rutas posibles porque Armbian cambia el nombre 
        # de la carpeta según el parche, asegurando que capture las fuentes.
