name: "Fase 1: Compilador de Kernel 6.18.44 (S905X)"

on:
  workflow_dispatch: # Control 100% manual por botón desde la web

jobs:
  build-specific-kernel:
    runs-on: ubuntu-24.04

    steps:
    - name: 1. Descargar este repositorio
      uses: actions/checkout@v4

    - name: 2. Clonar herramientas oficiales de Armbian
      run: |
        git clone --depth 1 https://github.com/armbian/build

    - name: 3. Ejecutar compilación forzada a 6.18.44
      run: |
        cd armbian-build
        # Forzamos la descarga exacta de la versión v6.18.44 del árbol estable
        sudo ./compile.sh \
          BOARD=amlogic-s905x \
          BRANCH=edge \
          RELEASE=bookworm \
          BUILD_MINIMAL=yes \
          KERNEL_CONFIGURE=no \
          INSTALL_HEADERS=yes \
          KERNEL_GIT_TAG="v6.18.44" \
          kernel

